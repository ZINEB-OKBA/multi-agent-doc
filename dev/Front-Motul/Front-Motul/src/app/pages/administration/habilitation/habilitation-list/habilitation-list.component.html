<div class="grid gap-5 lg:gap-7.5">
    <div class="kt-card kt-card-grid min-w-full">
        <div class="kt-card-header flex-wrap gap-2">
            <h3 class="kt-card-title text-sm">
                {{ 'MODULES.HABILITATIONS.TABLE_TITLE' | translate }}
            </h3>
            <div class="flex flex-wrap gap-2 lg:gap-5">
                <div class="flex">
                    <label class="kt-input">
                        <i class="ki-filled ki-magnifier">
                        </i>
                        <input
                                [placeholder]="'MODULES.HABILITATIONS.SEARCH' | translate"
                                type="text"
                                [(ngModel)]="term"
                                (input)="onFind()"/>
                    </label>
                </div>
                <div class="flex flex-wrap gap-2.5">
                    <button class="kt-btn  kt-btn-primary" (click)="onAdd()">
                        <i class="ki-filled ki-plus">
                        </i>
                        {{ 'MODULES.BUTTONS.NEW' | translate }}
                    </button>
                </div>
            </div>
        </div>
        <div class="kt-card-content">
            <div>
                <div class="kt-scrollable-x-auto">
                    <table class="kt-table table-auto kt-table-border">
                        <thead>
                        <ng-template #sortableHeader let-column="column" let-label="label">
                            <th class="min-w-[180px]">
                        <span class="kt-table-col">
                          <span class="kt-table-col-label">
                            {{ label }}
                          </span>
                          <span class="kt-table-col-sort"
                                (click)="onSort(column)"
                                [ngClass]="{
                                  'asc': page.column === column && page.direction === 'ASC',
                                  'desc': page.column === column && page.direction === 'DESC'
                                }">
                            <i *ngIf="page.column === column && page.direction === 'ASC'"
                               class="ki-filled  ki-up text-gray-800 text-xs "></i>
                            <i *ngIf="page.column === column && page.direction === 'DESC'"
                               class="ki-filled ki-down text-gray-800 text-xs"></i>
                          </span>
                        </span>
                            </th>
                        </ng-template>
                        <tr>
                            <ng-container
                                    *ngTemplateOutlet="sortableHeader; context: { column: 'name', label: ('MODULES.HABILITATIONS.COLUMNS.NAME' | translate) }"></ng-container>
                            <th class="w-[60px]"></th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr *ngFor="let profil of data?.content">
                            <td class="text-foreground font-normal">{{ profil.name }}</td>
                            <td class="text-center">
                                <div class="kt-menu flex-inline" data-kt-menu="true">
                                    <div class="kt-menu-item" data-kt-menu-item-offset="0, 10px"
                                         data-kt-menu-item-placement="bottom-end"
                                         data-kt-menu-item-placement-rtl="bottom-start"
                                         data-kt-menu-item-toggle="dropdown" data-kt-menu-item-trigger="click">
                                        <button class="kt-menu-toggle kt-btn kt-btn-sm kt-btn-icon kt-btn-ghost">
                                            <i class="ki-filled ki-dots-vertical text-lg">
                                            </i>
                                        </button>
                                        <div class="kt-menu-dropdown kt-menu-default w-full max-w-[175px]"
                                             data-kt-menu-dismiss="true">
                                            <div class="kt-menu-item">
                                                <a class="kt-menu-link" (click)="onEdit(profil.id)">
                      <span class="kt-menu-icon">
                       <i class="ki-filled ki-pencil">
                       </i>
                      </span>
                                                    <span class="kt-menu-title">
                       {{ 'MODULES.BUTTONS.EDIT' | translate }}
                      </span>
                                                </a>
                                            </div>
                                            <div class="kt-menu-separator">
                                            </div>
                                            <div class="kt-menu-item">
                                                <a class="kt-menu-link" (click)="onDelete(profil.id)">
                      <span class="kt-menu-icon">
                       <i class="ki-filled ki-trash">
                       </i>
                      </span>
                                                    <span class="kt-menu-title">
                       {{ 'MODULES.BUTTONS.DELETE' | translate }}
                      </span>
                                                </a>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </td>
                        </tr>

                        </tbody>
                    </table>
                </div>
                <div *ngIf="data?.totalElements > 0"
                     class="kt-card-footer justify-end flex gap-5 text-secondary-foreground text-sm font-medium">
                    <ngb-pagination
                            [collectionSize]="data?.totalElements"
                            [pageSize]="data.size"
                            [maxSize]="5"
                            [rotate]="true"
                            [boundaryLinks]="true"
                            [(page)]="currentPage">
                    </ngb-pagination>
                </div>
            </div>
        </div>
    </div>
</div>
