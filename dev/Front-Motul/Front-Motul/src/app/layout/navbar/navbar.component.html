<!-- Navbar -->
<div class="flex items-stretch lg:fixed z-5 top-(--header-height) start-(--sidebar-width) end-5 h-(--navbar-height) mx-5 lg:mx-0 bg-muted" id="navbar">
    <div class="rounded-t-xl border border-input border-b-input bg-background flex items-stretch grow">
        <!-- Container -->
        <div class="kt-container-fluid flex justify-between items-stretch gap-5">
            <div class="grid items-stretch">
                <div class="kt-scrollable-x-auto flex items-stretch">
                    <div class="kt-menu gap-5 lg:gap-7.5" data-kt-menu="true">
                        <ng-container *ngFor="let item of nav?.children; let i = index;">
                            <ng-container *ngIf="hasAuthorities(item.authorities)">
                                <ng-container *ngIf="item.type == 'sub'">
                                    <div class="kt-menu-item border-b-2 border-b-transparent kt-menu-item-active:border-b-mono kt-menu-item-here:border-b-mono" data-kt-menu-item-placement="bottom-start" data-kt-menu-item-placement-rtl="bottom-end" data-kt-menu-item-toggle="dropdown" data-kt-menu-item-trigger="click|lg:hover">
                                        <div class="kt-menu-link gap-1.5" tabindex="0"
                                             (click)="onParentClick(item, $event)"
                                        >
            <span class="kt-menu-title text-nowrap text-sm text-foreground kt-menu-item-active:text-mono kt-menu-item-active:font-medium kt-menu-item-here:text-mono kt-menu-item-here:font-medium kt-menu-item-show:text-mono kt-menu-link-hover:text-mono">
             Account Home
            </span>
                                            <span class="kt-menu-arrow">
             <i class="ki-filled ki-down text-xs text-muted-foreground">
             </i>
            </span>
                                        </div>
                                        <div class="kt-menu-dropdown kt-menu-default py-2 min-w-[200px]">
                                            <div class="kt-menu-item">
                                                <a class="kt-menu-link" href="html/demo3.html" tabindex="0">
              <span class="kt-menu-title">
               Dashboard
              </span>
                                                </a>
                                            </div>
                                            <div class="kt-menu-item">
                                                <a class="kt-menu-link" href="html/demo3/account/home/get-started.html" tabindex="0">
              <span class="kt-menu-title">
               Get Started
              </span>
                                                </a>
                                            </div>
                                            <div class="kt-menu-item">
                                                <a class="kt-menu-link" href="html/demo3/account/home/user-profile.html" tabindex="0">
              <span class="kt-menu-title">
               User Profile
              </span>
                                                </a>
                                            </div>
                                            <div class="kt-menu-item">
                                                <a class="kt-menu-link" href="html/demo3/account/home/company-profile.html" tabindex="0">
              <span class="kt-menu-title">
               Company Profile
              </span>
                                                </a>
                                            </div>
                                            <div class="kt-menu-item">
                                                <a class="kt-menu-link" href="html/demo3/account/home/settings-sidebar.html" tabindex="0">
              <span class="kt-menu-title">
               Settings - With Sidebar
              </span>
                                                </a>
                                            </div>
                                            <div class="kt-menu-item">
                                                <a class="kt-menu-link" href="html/demo3/account/home/settings-enterprise.html" tabindex="0">
              <span class="kt-menu-title">
               Settings - Enterprise
              </span>
                                                </a>
                                            </div>
                                            <div class="kt-menu-item">
                                                <a class="kt-menu-link" href="html/demo3/account/home/settings-plain.html" tabindex="0">
              <span class="kt-menu-title">
               Settings - Plain
              </span>
                                                </a>
                                            </div>
                                            <div class="kt-menu-item">
                                                <a class="kt-menu-link" href="html/demo3/account/home/settings-modal.html" tabindex="0">
              <span class="kt-menu-title">
               Settings - Modal
              </span>
                                                </a>
                                            </div>
                                        </div>
                                    </div>
                                </ng-container>
                                <ng-container *ngIf="item.type == 'link'">
                                    <div class="kt-menu-item border-b-2 border-b-transparent kt-menu-item-active:border-b-mono kt-menu-item-here:border-b-mono">
                                        <a class="kt-menu-link gap-2.5" [routerLink]="item.path" tabindex="0">
                     <span class="kt-menu-icon">
                      <i class="{{item.icon}} text-lg"></i>
                    </span>
                                            <span class="kt-menu-title text-nowrap text-sm text-foreground kt-menu-item-active:text-mono kt-menu-item-active:font-medium kt-menu-item-here:text-mono kt-menu-item-here:font-medium kt-menu-item-show:text-mono kt-menu-link-hover:text-mono">
                      {{item.title | translate}}
                    </span>
                                        </a>
                                    </div>
                                </ng-container>
                            </ng-container>
                        </ng-container>


                    </div>
                </div>
            </div>
            <div class="kt-menu flex-inline" data-kt-menu="true" *ngIf="isDisplayActionButtons">
                <div class="kt-menu-item" data-kt-menu-item-offset="0, 10px" data-kt-menu-item-placement="bottom-end" data-kt-menu-item-placement-rtl="bottom-start" data-kt-menu-item-toggle="dropdown" data-kt-menu-item-trigger="click">
                    <button class="kt-menu-toggle kt-btn kt-btn-sm kt-btn-icon kt-btn-ghost">
                        <i class="ki-filled ki-dots-vertical text-lg"></i>
                    </button>
                </div>
            </div>
        </div>
        <!-- End of Container -->
    </div>
</div>
<!-- End of Navbar -->
